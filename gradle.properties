# Sized for a shared 4-CPU / 15 GB box running up to 3 builds at once (~4 GB peak each:
# Gradle daemon 2 GB + Kotlin daemon ~1 GB + one test JVM).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=2
org.gradle.parallel=false
# Idle daemons exit after 15 min so finished worktrees release memory.
org.gradle.daemon.idletimeout=900000
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
