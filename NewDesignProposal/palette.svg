<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="920" viewBox="0 0 1160 920" font-family="'Noto Sans','Noto Kufi Arabic',system-ui,sans-serif">
  <rect width="1160" height="920" fill="#F2F6F4"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#142421">Mawaqeet · A Day That Breathes</text>
  <text x="40" y="80" font-size="15" fill="#56706A">Design proposal — palette chart · light + dark + sky phases</text>

  <!-- Section 1: core swatches -->
  <text x="40" y="124" font-size="17" font-weight="700" fill="#1F6F66">Core / brand</text>
  <g>
    <rect x="40"  y="138" width="120" height="78" rx="12" fill="#1F6F66"/>
    <rect x="170" y="138" width="120" height="78" rx="12" fill="#134A44"/>
    <rect x="300" y="138" width="120" height="78" rx="12" fill="#E0A246"/>
    <rect x="430" y="138" width="120" height="78" rx="12" fill="#F2B65E"/>
    <rect x="560" y="138" width="120" height="78" rx="12" fill="#C97A6B"/>
    <rect x="690" y="138" width="120" height="78" rx="12" fill="#F2F6F4" stroke="#D3DFDB"/>
    <rect x="820" y="138" width="120" height="78" rx="12" fill="#0E1917"/>
    <rect x="950" y="138" width="120" height="78" rx="12" fill="#142421"/>

    <g font-size="12" fill="#142421" text-anchor="middle">
      <text x="100"  y="232">Teal</text><text x="100"  y="248" font-size="11" fill="#56706A">#1F6F66</text>
      <text x="230"  y="232">Deep teal</text><text x="230"  y="248" font-size="11" fill="#56706A">#134A44</text>
      <text x="360"  y="232">Dawn amber</text><text x="360"  y="248" font-size="11" fill="#56706A">#E0A246</text>
      <text x="490"  y="232">Amber dark</text><text x="490"  y="248" font-size="11" fill="#56706A">#F2B65E</text>
      <text x="620"  y="232">Rose</text><text x="620"  y="248" font-size="11" fill="#56706A">#C97A6B</text>
      <text x="750"  y="232">Day mist</text><text x="750"  y="248" font-size="11" fill="#56706A">#F2F6F4</text>
      <text x="880"  y="232">Isha night</text><text x="880"  y="248" font-size="11" fill="#9BB3AB">#0E1917</text>
      <text x="1010" y="232">Ink</text><text x="1010" y="248" font-size="11" fill="#9BB3AB">#142421</text>
    </g>
  </g>

  <!-- Section 2: sky phases -->
  <text x="40" y="300" font-size="17" font-weight="700" fill="#1F6F66">Sky phases — gradient stops + ambient glows</text>
  <g font-size="12">
    <!-- dawn -->
    <g transform="translate(40,316)">
      <rect width="250" height="120" rx="14" fill="#F6E7CE"/>
      <rect width="250" height="120" rx="14" fill="url(#glowDawn)"/>
      <text x="14" y="104" fill="#5A3D16" font-weight="700">dawn</text>
      <text x="14" y="122" fill="#5A3D16">amber + rose glow</text>
    </g>
    <!-- day -->
    <g transform="translate(310,316)">
      <rect width="250" height="120" rx="14" fill="#F2F6F4"/>
      <rect width="250" height="120" rx="14" fill="url(#glowDay)"/>
      <text x="14" y="104" fill="#142421" font-weight="700">day</text>
      <text x="14" y="122" fill="#56706A">mist + teal glow</text>
    </g>
    <!-- dusk -->
    <g transform="translate(580,316)">
      <rect width="250" height="120" rx="14" fill="#CFE6E1"/>
      <rect width="250" height="120" rx="14" fill="url(#glowDusk)"/>
      <text x="14" y="104" fill="#134A44" font-weight="700">dusk</text>
      <text x="14" y="122" fill="#134A44">teal + amber glow</text>
    </g>
    <!-- night -->
    <g transform="translate(850,316)">
      <rect width="250" height="120" rx="14" fill="#0E1917"/>
      <rect width="250" height="120" rx="14" fill="url(#glowNight)"/>
      <text x="14" y="104" fill="#9FC9C0" font-weight="700">night</text>
      <text x="14" y="122" fill="#9FC9C0">teal + night glow</text>
    </g>
  </g>

  <!-- Section 3: light vs dark surfaces -->
  <text x="40" y="488" font-size="17" font-weight="700" fill="#1F6F66">Light vs dark — surfaces</text>
  <g font-size="12">
    <g transform="translate(40,502)">
      <rect width="250" height="64" rx="14" fill="#FFFFFF" stroke="#D3DFDB"/>
      <rect width="250" height="64" rx="14" fill="rgba(255,255,255,.72)" stroke="#D3DFDB"/>
      <text x="14" y="84" fill="#56706A">light surface (72% white)</text>
    </g>
    <g transform="translate(310,502)">
      <rect width="250" height="64" rx="14" fill="#FBFDFC" stroke="#D3DFDB"/>
      <text x="14" y="84" fill="#56706A">light bar / field</text>
    </g>
    <g transform="translate(580,502)">
      <rect width="250" height="64" rx="14" fill="#15221F"/>
      <rect width="250" height="64" rx="14" fill="rgba(24,44,41,.6)"/>
      <text x="14" y="84" fill="#9BB3AB">dark surface (60%)</text>
    </g>
    <g transform="translate(850,502)">
      <rect width="250" height="64" rx="14" fill="#12201E"/>
      <text x="14" y="84" fill="#9BB3AB">dark bar</text>
    </g>
  </g>

  <!-- Section 4: type specimen -->
  <text x="40" y="620" font-size="17" font-weight="700" fill="#1F6F66">Type specimen</text>
  <g>
    <text x="40"  y="662" font-size="34" font-weight="700" fill="#1F6F66" font-family="'Noto Kufi Arabic',sans-serif" direction="rtl">مواقيت · الفجر ٤:٤٨</text>
    <text x="40"  y="690" font-size="13" fill="#56706A">Noto Kufi Arabic — display / prayer names / times</text>
    <text x="40"  y="736" font-size="20" fill="#142421" font-family="'Noto Naskh Arabic',serif" direction="rtl">الصلاة القادمة · العصر · بعد ١ س ٢٣ د</text>
    <text x="40"  y="760" font-size="13" fill="#56706A">Noto Naskh Arabic — devotional / running text</text>
    <text x="40"  y="804" font-size="18" fill="#142421">Next prayer · Asr · in 1h 23m</text>
    <text x="40"  y="828" font-size="13" fill="#56706A">Noto Sans — UI labels, settings, chrome</text>
  </g>

  <defs>
    <radialGradient id="glowDawn" cx="0.25" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#E0A246" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#C97A6B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#C97A6B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowDay" cx="0.25" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#1F6F66" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1F6F66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowDusk" cx="0.25" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#1F6F66" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#E0A246" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#E0A246" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowNight" cx="0.25" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#1F6F66" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#0E1917" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0E1917" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
